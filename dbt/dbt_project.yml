name: aws_lakehouse
version: '1.0.0'
config-version: 2

profile: aws_lakehouse

model-paths: ["models"]
macro-paths: ["macros"]

models:
  aws_lakehouse:
    silver:
      +materialized: "{{ 'iceberg_table' if target.name == 'prod' else 'table' }}"
      +database: "{{ 's3_tables' if target.name == 'prod' else target.database }}"
      +schema: "{{ env_var('S3_TABLES_NAMESPACE', 'silver') if target.name == 'prod' else 'silver' }}"
