version: 2

models:
  - name: stg_orders
    description: >
      Incremental orders — baseline (cast types, normalized status, PK
      filter) from bronze.orders on first run, CDC batches (insert/update/
      delete) applied on every run after (see
      macros/incremental_strategy_cdc_merge.sql). The unique/not_null tests
      here are the ones that would have caught the merge-ambiguity bugs
      documented in ARCHITECTURE.md §3.18/§3.19.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_clients')
                field: customer_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_inventory')
                field: product_id
      - name: quantity
        data_tests:
          - not_null
      - name: amount
        data_tests:
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['paid', 'pending', 'cancelled', 'refunded']

  - name: stg_clients
    description: >
      Incremental clients — baseline from bronze.clients on first run, CDC
      batches applied after.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: country
        data_tests:
          - not_null
      - name: segment
        data_tests:
          - accepted_values:
              arguments:
                values: ['retail', 'wholesale', 'vip']

  - name: stg_inventory
    description: >
      Incremental inventory — baseline from bronze.inventory on first run,
      CDC batches applied after.
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: warehouse_id
        data_tests:
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'discontinued']
