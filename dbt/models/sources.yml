version: 2

sources:
  - name: bronze
    description: >
      Raw files landed by the ingestion job. Read directly from S3 by
      dbt-duckdb (no Glue/Athena catalog involved on the read side) via the
      `external_location` meta config, so no attach/secret is required beyond
      the httpfs S3 credentials already configured for the `prod` target.
      The `dev` target reads the local sample CSV instead, so `dbt run
      --target dev` works end-to-end without AWS access.
    meta:
      external_location: >-
        {{ '../ingestion/sample_data/{name}.csv' if target.name != 'prod'
        else 's3://' ~ env_var('LANDING_BUCKET', 'REPLACE_ME') ~ '/bronze/{name}/*.csv' }}
    tables:
      - name: orders
      - name: clients
      - name: inventory

      # CDC batches (insert/update/delete rows tagged with a `_cdc_op`
      # column), generated by ingestion/simulate_cdc.py. Read by the
      # incremental models in models/silver/{orders,clients,inventory}.sql
      # — see dbt/macros/incremental_strategy_cdc_merge.sql. A separate S3
      # prefix (bronze/<entity>/cdc/) from the full-load files above, so the
      # per-table `config.external_location` override is needed here (the
      # source-level default only handles the flat bronze/<name>/ pattern).
      - name: orders_cdc
        config:
          external_location: >-
            {{ '../ingestion/sample_data/orders_cdc.csv' if target.name != 'prod'
            else 's3://' ~ env_var('LANDING_BUCKET', 'REPLACE_ME') ~ '/bronze/orders/cdc/*.csv' }}
      - name: clients_cdc
        config:
          external_location: >-
            {{ '../ingestion/sample_data/clients_cdc.csv' if target.name != 'prod'
            else 's3://' ~ env_var('LANDING_BUCKET', 'REPLACE_ME') ~ '/bronze/clients/cdc/*.csv' }}
      - name: inventory_cdc
        config:
          external_location: >-
            {{ '../ingestion/sample_data/inventory_cdc.csv' if target.name != 'prod'
            else 's3://' ~ env_var('LANDING_BUCKET', 'REPLACE_ME') ~ '/bronze/inventory/cdc/*.csv' }}
