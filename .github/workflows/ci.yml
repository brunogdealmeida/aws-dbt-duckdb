name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: dbt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: dbt parse
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: dbt parse --target dev

      - name: dbt compile
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: dbt compile --target dev

      - name: Build Docker image
        run: docker build -f dbt/Dockerfile -t lakehouse-ci:${{ github.sha }} .
