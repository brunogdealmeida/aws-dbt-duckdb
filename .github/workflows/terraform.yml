name: Terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: dev

    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Write backend + tfvars config
        run: |
          cat > backend.hcl <<EOF
          bucket         = "${{ vars.TF_STATE_BUCKET }}"
          key            = "${{ vars.TF_STATE_KEY }}"
          region         = "${{ vars.AWS_REGION }}"
          dynamodb_table = "${{ vars.TF_STATE_LOCK_TABLE }}"
          EOF

          cat > terraform.tfvars.json <<EOF
          {
            "aws_region": "${{ vars.AWS_REGION }}",
            "project_name": "${{ vars.PROJECT_NAME }}",
            "environment": "${{ vars.ENVIRONMENT }}",
            "github_repository": "${{ github.repository }}",
            "github_branch": "main",
            "landing_bucket_name": "${{ vars.LANDING_BUCKET_NAME }}",
            "s3_tables_bucket_name": "${{ vars.S3_TABLES_BUCKET_NAME }}",
            "s3_tables_namespace": "${{ vars.S3_TABLES_NAMESPACE }}",
            "dbt_logs_bucket_name": "${{ vars.DBT_LOGS_BUCKET_NAME }}",
            "athena_results_bucket_name": "${{ vars.ATHENA_RESULTS_BUCKET_NAME }}",
            "athena_data_catalog_name": "${{ vars.ATHENA_DATA_CATALOG_NAME }}",
            "lakeformation_admin_arns": ${{ vars.LAKEFORMATION_ADMIN_ARNS || '[]' }},
            "athena_reader_principal_arns": ${{ vars.ATHENA_READER_PRINCIPAL_ARNS || '[]' }},
            "enable_lakeformation_s3tables_integration": ${{ vars.ENABLE_LAKEFORMATION_S3TABLES_INTEGRATION || 'true' }},
            "force_destroy_buckets": ${{ vars.FORCE_DESTROY_BUCKETS || 'false' }}
          }
          EOF

      - run: terraform fmt -check
      - run: terraform init -backend-config=backend.hcl
      - run: terraform validate
      - run: terraform plan -out=tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          # .query_lambda.zip alongside tfplan: `data.archive_file` (see
          # infra/query_service.tf) writes that zip to local disk as a
          # side effect of `terraform plan`, and the apply job below runs
          # on a separate, fresh runner — without it too, `apply` fails
          # with "no such file or directory" trying to read a zip that was
          # only ever written to the plan job's now-gone filesystem.
          # Confirmed by hitting exactly this the first time this resource
          # was added.
          path: |
            infra/tfplan
            infra/.query_lambda.zip
          # actions/upload-artifact@v4 excludes dotfiles by default — without
          # this, .query_lambda.zip is silently dropped ("there will be 1
          # file uploaded" in the log, no error) and apply fails the same
          # way as before this whole fix. Confirmed by hitting exactly this
          # on the first attempt at the fix above.
          include-hidden-files: true
          retention-days: 5

  apply:
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev # add required reviewers on this GitHub Environment to gate applies

    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Write backend config
        run: |
          cat > backend.hcl <<EOF
          bucket         = "${{ vars.TF_STATE_BUCKET }}"
          key            = "${{ vars.TF_STATE_KEY }}"
          region         = "${{ vars.AWS_REGION }}"
          dynamodb_table = "${{ vars.TF_STATE_LOCK_TABLE }}"
          EOF

      - run: terraform init -backend-config=backend.hcl

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra

      - run: terraform apply -auto-approve tfplan
